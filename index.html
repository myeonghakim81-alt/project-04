<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>TANKTANK</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#04140c" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TANKTANK" />
</head>
<body>
  <div id="game-wrap">
    <div class="header-row">
      <h1>TANKTANK <span>PROTOTYPE v0.17</span></h1>
      <select id="lang-select" aria-label="Language"></select>
    </div>
    <div id="stage-container">
      <canvas id="game-canvas"></canvas>

      <div id="title-screen" class="overlay title-overlay">
        <h2 class="title-logo">TANKTANK</h2>
        <p class="title-tagline" data-i18n="titleTagline"></p>
        <p class="title-prompt" data-i18n="titlePrompt"></p>
      </div>

      <div id="difficulty-screen" class="overlay hidden">
        <h2 data-i18n="diffScreenTitle"></h2>
        <div class="difficulty-cards">
          <button type="button" class="diff-card" data-diff="easy">
            <span class="diff-name" data-i18n="diffEasy"></span>
            <span class="diff-desc" data-i18n-bi="diffEasyDesc"></span>
          </button>
          <button type="button" class="diff-card" data-diff="normal">
            <span class="diff-name" data-i18n="diffNormal"></span>
            <span class="diff-desc" data-i18n-bi="diffNormalDesc"></span>
          </button>
          <button type="button" class="diff-card" data-diff="hard">
            <span class="diff-name" data-i18n="diffHard"></span>
            <span class="diff-desc" data-i18n-bi="diffHardDesc"></span>
          </button>
        </div>
        <p class="mobile-note" data-i18n-bi="mobileNote"></p>
      </div>

      <div id="stageclear-screen" class="overlay hidden">
        <h2 id="stageclear-title">STAGE CLEAR!</h2>
        <p id="stageclear-info"></p>
        <button id="next-stage-btn" data-i18n="scBtnNextStage"></button>
      </div>

      <div id="gameover-screen" class="overlay hidden">
        <h2 id="gameover-title" data-i18n="goTitle"></h2>
        <p id="gameover-info"></p>
        <div class="gameover-buttons">
          <button id="restart-btn" data-i18n="goBtnRestart"></button>
          <button id="continue-btn" class="secondary" data-i18n="goBtnContinue"></button>
        </div>
      </div>
    </div>

    <div class="control-panel">
      <span class="key">↑↓←→ / WASD</span> <span data-i18n="ctrlMove"></span> &nbsp;&nbsp;
      <span class="key">SPACE</span> <span data-i18n="ctrlFire"></span> &nbsp;&nbsp;
      <span class="key">SHIFT</span> <span data-i18n="ctrlSwitch"></span>
    </div>

    <div class="touch-controls">
      <div class="joystick-zone" id="joystick-zone">
        <div class="joystick-base">
          <div class="joystick-stick" id="joystick-stick"></div>
        </div>
      </div>
      <div class="action-buttons">
        <button type="button" class="touch-btn" id="weapon-btn" data-i18n="btnSwap"></button>
        <button type="button" class="touch-btn" id="fire-btn" data-i18n="btnFire"></button>
      </div>
    </div>

    <p class="hint" data-i18n-bi="hintText"></p>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/maze.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
